<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <!-- Affiche le site correctement selon l'appareil de l'utilisateur -->
  <!-- Displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <!-- Police API Space Mono sur Google Fonts -->
  <!-- API font Space Mono on Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <link href="styles.css" rel="stylesheet">
  <script src="script.js" defer></script>

  <title>Frontend Mentor | Tip calculator app</title>
</head>

<body>

  <img class="logo" src="./images/logo.svg" alt="Logo tip calculator app">

  <div class="card-tips">

    <form class="calculator-form">
      <!-- Groupe 1 : Facture -->
      <!-- Group 1 : Bill -->
      <div class="form-group">
        <label for="bill">Bill</label>
          <div class="input-wrapper">
            <img src="./images/icon-dollar.svg" alt="Icon dollar">
            <input type="number" id="bill" name="bill" placeholder="0" step="0.01" min="0">
          </div>
      </div>

      <!-- Groupe 2 : Sélection du % de pourboire -->
      <!-- Group 2 : Select Tip % -->
      <div class="form-group">
        <p class="label-title">Select Tip %</p>
          <div class="tip-options">
            <button type="button" class="tip-btn" data-tip="5">5%</button>
            <button type="button" class="tip-btn" data-tip="10">10%</button>
            <button type="button" class="tip-btn" data-tip="15">15%</button>
            <button type="button" class="tip-btn" data-tip="25">25%</button>
            <button type="button" class="tip-btn" data-tip="50">50%</button>
            <input type="number" id="custom-tip" placeholder="Custom" min="0">
          </div>
      </div>
        
      <!-- Groupe 3 : Nombre de personnes -->
      <!-- Group 3 : Number of People -->
      <div class="form-group">
        <div class="people-header">
          <label for="people">Number of People</label>
          <span class="error-msg">Can't be zero</span>
        </div>      
        <div class="input-wrapper">
          <img src="./images/icon-person.svg" alt="Icon person">
          <input type="number" id="people" name="people" placeholder="0" min="0">
        </div>
      </div>  
    </form>


      <!-- Bloc 4 : Résultats du calculateur -->
      <!-- Bloc 4 : Calculator results -->
      <div class="calculator-results">

        <!-- Ligne 1 : Montant du pourboire -->
        <!-- Line 1 : Tip Amount -->
        <div class="result-item">
          <div class="result-label">
            <p class="title">Tip Amount</p>
            <p class="subtitle">/ person</p>
          </div>
          <span class="amount" id="tip-amount">$0.00</span>
        </div>

        <!-- Ligne 2 : Total -->
        <!-- Line 2 : Total -->
        <div class="result-item">
          <div class="result-label">
            <p class="title">Total</p>
            <p class="subtitle">/ person</p>
          </div>
          <span class="amount" id="total-amount">$0.00</span>
        </div>

        <!-- Ligne 3 : Bouton de réinitialisation -->
        <!-- Line 3 : Reset button -->
        <button type="reset" id="reset-btn" class="reset-btn" disabled>RESET</button>
      </div>

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Kaïna SLIMANI</a>.
  </footer>
</body>
</html>
